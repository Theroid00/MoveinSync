server.port: 8080
spring:
  application.name: roster-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/roster?socketTimeout=10&connectTimeout=2
    username: roster_app
    password: roster_app_pw
    hikari: { maximum-pool-size: 20, connection-timeout: 2000 }
  flyway: { user: roster_owner, password: roster_owner_pw }
  jackson.deserialization.fail-on-unknown-properties: true
  servlet.multipart: { max-file-size: 300MB, max-request-size: 310MB }
  cache.type: caffeine
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  # Histograms for roster_event_apply_seconds and outbox_delivery_lag_seconds are published in code
  # (Timer.publishPercentileHistogram), keyed by meter name rather than the exported name.
  metrics.distribution.percentiles-histogram:
    roster.event.apply: true
    outbox.delivery.lag: true
app:
  tenant-source-default: hr-main
  relay: { enabled: true, poll-ms: 200, batch: 100, lease-secs: 30, max-attempts: 10, retention-days: 7 }
  booking.base-url: http://localhost:8081
  recon: { dir: /tmp/recon, recover-on-startup: true }
  jwt.key-path: /tmp/jwt/key.pem
  auth:
    dev-issuer.enabled: true
    # Demo users (spec §12.2). Plain passwords here are BCrypt-hashed at startup.
    users:
      - { username: hr@acme, password: demo123, tenant: acme, roles: [HR_INTEGRATION] }
      - { username: admin@acme, password: demo123, tenant: acme, roles: [ADMIN] }
      - { username: ops@acme, password: demo123, tenant: acme, roles: [OPERATOR] }
      - { username: emp001@acme, password: demo123, tenant: acme, roles: [EMPLOYEE], employeeId: EMP-001 }
      - { username: hr@globex, password: demo123, tenant: globex, roles: [HR_INTEGRATION] }
      - { username: admin@globex, password: demo123, tenant: globex, roles: [ADMIN] }
      - { username: ops@globex, password: demo123, tenant: globex, roles: [OPERATOR] }
      - { username: emp001@globex, password: demo123, tenant: globex, roles: [EMPLOYEE], employeeId: EMP-001 }
  faults.point: ""
  dev-seed.enabled: false
  # Second pool for reconciliation: socketTimeout must exceed the 300 s statement_timeout,
  # otherwise the driver kills a legitimately long apply. Wired manually in BulkDbConfig.
  bulk-datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/roster?socketTimeout=330&connectTimeout=2
    username: roster_app
    password: roster_app_pw
    maximum-pool-size: 3
    connection-timeout: 5000
