name: roster-sync

# One command: `docker compose up --build` → postgres + roster-service (8080) + booking-service (8081), seeded.
# Image tags are pinned (never `latest`); digests are recorded in docs/known-issues.md.

x-java-health: &java-health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker: mount the parent.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: during init the entrypoint runs a socket-only temporary server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U roster_app -d roster"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  roster:
    build:
      context: .
      dockerfile: docker/Dockerfile.roster
    image: roster-sync/roster-service:local
    environment:
      DB_HOST: postgres
      APP_BOOKING_BASE_URL: http://booking:8081
      APP_JWT_KEY_PATH: /data/jwt/key.pem
      APP_RECON_DIR: /data/recon
      APP_AUTH_DEV_ISSUER_ENABLED: "true"
      APP_DEV_SEED_ENABLED: "true"
    volumes:
      - jwtkeys:/data/jwt
      - recon:/data/recon
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"UP\"'"]
    restart: unless-stopped

  booking:
    build:
      context: .
      dockerfile: docker/Dockerfile.booking
    image: roster-sync/booking-service:local
    environment:
      DB_HOST: postgres
      APP_ROSTER_JWKS_URI: http://roster:8080/.well-known/jwks.json
      APP_DEV_SEED_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"UP\"'"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      roster: { condition: service_healthy }
      booking: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.4.14
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: demo123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/roster.json:/var/lib/grafana/dashboards/roster.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  k6:
    image: grafana/k6:1.8.2
    profiles: [bench]
    user: "0:0"
    environment:
      BASE_URL: http://roster:8080
    volumes:
      - ./k6:/scripts:ro
      - ./bench/results:/results
      - ./bench/tmp:/raw
    depends_on:
      roster:
        condition: service_healthy

volumes:
  pgdata:
  jwtkeys:
  recon:
  prometheus-data:
  grafana-data:
