rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: roster_safety_brake_trips_total
        values: '0 1+0x30'
      - series: 'reconciliation_runs_total{status="FAILED"}'
        values: '0 1+0x30'
      - series: outbox_oldest_pending_age_seconds
        values: '61+0x30'
      - series: 'outbox_queue_depth{state="DEAD"}'
        values: '1+0x30'
      - series: 'roster_events_total{outcome="REJECTED"}'
        values: '0+10x30'
      - series: 'roster_events_total{outcome="APPLIED"}'
        values: '0+90x30'
      - series: 'booking_consumer_events_total{result="duplicate"}'
        values: '0+30x30'
      - series: 'booking_consumer_events_total{result="processed"}'
        values: '0+70x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: SafetyBrakeTripped
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: A reconciliation needs operator review
              description: Inspect the pending-approval endpoint before approving any inferred absences.
      - eval_time: 1m
        alertname: ReconciliationFailed
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: A reconciliation failed
              description: Inspect run status and error codes, then retry the retained file.
      - eval_time: 12m
        alertname: OutboxLagHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Oldest undelivered event exceeds 60 seconds
              description: Check booking health, relay retries and dead predecessors.
      - eval_time: 12m
        alertname: OutboxDeadLetters
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Dead letters block later changes for affected employees
              description: Correct the delivery failure and replay the dead event with the operator endpoint.
      - eval_time: 12m
        alertname: ValidationRejectSpike
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: More than five percent of HR events are rejected
              description: Inspect rejection codes and correct the source data.
      - eval_time: 12m
        alertname: ConsumerDuplicatesSpike
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: More than twenty percent of consumer deliveries are duplicates
              description: Check lost acknowledgements, retries and lease expiry.
  - interval: 1m
    input_series:
      - series: roster_safety_brake_trips_total
        values: '0+0x30'
      - series: 'reconciliation_runs_total{status="FAILED"}'
        values: '0+0x30'
      - series: outbox_oldest_pending_age_seconds
        values: '0+0x30'
      - series: 'outbox_queue_depth{state="DEAD"}'
        values: '0+0x30'
      - series: 'roster_events_total{outcome="REJECTED"}'
        values: '0+0x30'
      - series: 'roster_events_total{outcome="APPLIED"}'
        values: '0+0x30'
      - series: 'booking_consumer_events_total{result="duplicate"}'
        values: '0+0x30'
      - series: 'booking_consumer_events_total{result="processed"}'
        values: '0+0x30'
    alert_rule_test:
      - { eval_time: 12m, alertname: SafetyBrakeTripped, exp_alerts: [] }
      - { eval_time: 12m, alertname: ReconciliationFailed, exp_alerts: [] }
      - { eval_time: 12m, alertname: OutboxLagHigh, exp_alerts: [] }
      - { eval_time: 12m, alertname: OutboxDeadLetters, exp_alerts: [] }
      - { eval_time: 12m, alertname: ValidationRejectSpike, exp_alerts: [] }
      - { eval_time: 12m, alertname: ConsumerDuplicatesSpike, exp_alerts: [] }
