server.port: 8081
spring:
  application.name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/booking?socketTimeout=10&connectTimeout=2
    username: booking_app
    password: booking_app_pw
    hikari: { maximum-pool-size: 20, connection-timeout: 2000 }
  flyway: { user: booking_owner, password: booking_owner_pw }
  jackson.deserialization.fail-on-unknown-properties: true
logging.structured.format.console: ecs
# Interactive docs are on deliberately for this demo; production sets SPRINGDOC_API_DOCS_ENABLED=false
# and SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc:
  api-docs.enabled: true
  swagger-ui: { enabled: true, persist-authorization: true, operations-sorter: alpha, tags-sorter: alpha }
management:
  endpoints.web.exposure.include: health,info,prometheus
app:
  roster.jwks-uri: ${APP_ROSTER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  faults.point: ""
  dev-seed.enabled: false
